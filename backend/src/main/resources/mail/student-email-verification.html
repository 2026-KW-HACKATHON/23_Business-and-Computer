<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>[가꿈] 학생 이메일 인증번호</title>
</head>
<body style="margin:0; padding:0; background-color:#f3f6f4; -webkit-text-size-adjust:100%;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">
    가꿈 학생 이메일 인증번호는 {{code}}입니다. 10분 안에 입력해 주세요.
  </div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f6f4;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
               style="max-width:480px; background-color:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 2px 12px rgba(31,61,46,0.08);">
          <tr>
            <td style="background-color:#2f7d5b; padding:28px 32px;">
              <span style="font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:22px; font-weight:700; color:#ffffff; letter-spacing:-0.3px;">가꿈</span>
            </td>
          </tr>
          <tr>
            <td style="padding:36px 32px 8px 32px; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
              <h1 style="margin:0 0 12px 0; font-size:20px; font-weight:700; color:#1f2a24; letter-spacing:-0.3px;">학생 이메일 인증</h1>
              <p style="margin:0; font-size:15px; line-height:1.6; color:#4a5750;">
                아래 인증번호를 가꿈 화면에 입력해 주세요.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                     style="background-color:#eef6f1; border:1px solid #cfe5d8; border-radius:12px;">
                <tr>
                  <td align="center" style="padding:24px 16px;">
                    <div style="font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:13px; color:#2f7d5b; font-weight:600; margin-bottom:8px;">인증번호</div>
                    <div style="font-family:'SFMono-Regular',Menlo,Consolas,monospace; font-size:34px; font-weight:700; letter-spacing:8px; color:#1f2a24;">{{code}}</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 32px 32px; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
              <p style="margin:0 0 6px 0; font-size:14px; line-height:1.6; color:#4a5750;">
                인증번호는 <strong style="color:#1f2a24;">10분</strong> 동안만 유효합니다.
              </p>
              <p style="margin:0; font-size:14px; line-height:1.6; color:#4a5750;">
                본인이 요청하지 않았다면 이 메일을 무시해 주세요.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px; border-top:1px solid #edf0ee; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
              <p style="margin:0; font-size:12px; line-height:1.6; color:#8a968f;">
                이 메일은 발신 전용입니다. 회신하셔도 답변을 받을 수 없습니다.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
