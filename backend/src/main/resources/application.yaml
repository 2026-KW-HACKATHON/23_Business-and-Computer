spring:
  application:
    name: backend
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE}
      minimum-idle: ${DATABASE_MIN_POOL_SIZE}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT}
      idle-timeout: ${DATABASE_IDLE_TIMEOUT}
      max-lifetime: ${DATABASE_MAX_LIFETIME}
  jpa:
    hibernate:
      ddl-auto: validate
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000 # 1시간
  refresh-token-expiration: 604800000 # 7일