logging:
  pattern:
    console: '%clr(%5p) %clr([%X{tid:-}]){magenta} %clr(%replace(%logger){''^.*\.([^.]+\.[^.]+)$'',''$1''}){cyan} %clr(:){faint} %m%n%wEx'

server:
  servlet:
    session:
      cookie: # 세션(JSESSIONID)은 카카오 로그인 중 인가 요청(state)과 시작 주소만 담는다. 카카오가 돌려보내는 콜백은 최상위 GET 이동이라 Lax 쿠키도 실린다
        http-only: true
        secure: true # Chrome·Firefox 는 http://localhost 에서도 Secure 쿠키를 받는다. http 로 IP 주소에 접속해 로그인할 때만 SERVER_SERVLET_SESSION_COOKIE_SECURE=false 로 끈다
        same-site: lax

spring:
  application:
    name: backend
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 3s
      timeout: 3s
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      repositories:
        enabled: false # Redis는 Streams에 사용하고, 도메인 저장소는 JPA로 유지한다
  output:
    ansi:
      enabled: never # docker logs처럼 TTY가 아닌 환경에서도 색상을 출력한다
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE}
      minimum-idle: ${DATABASE_MIN_POOL_SIZE}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT}
      idle-timeout: ${DATABASE_IDLE_TIMEOUT}
      max-lifetime: ${DATABASE_MAX_LIFETIME}
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: Kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${KAKAO_REDIRECT_URI}
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:7200000} # 2시간. 만료되면 프론트가 /refresh로 새로 받는다
  refresh-token-expiration: 604800000 # 7일
demo-login: # 로그인 없는 체험용 데모 로그인(POST /demo/login). enabled가 true인 서버에서만 엔드포인트가 등록된다
  enabled: ${DEMO_LOGIN_ENABLED:true}
  max-new-sessions-per-hour: ${DEMO_LOGIN_MAX_NEW_SESSIONS_PER_HOUR:500} # 최근 1시간에 새로 만들 수 있는 데모 계정 쌍 수
nts-businessman:
  service-key: ${NTS_BUSINESSMAN_SERVICE_KEY}
frontend: # 프론트 주소. CORS 허용 목록이자 소셜 로그인 뒤 돌아갈 수 있는 주소이고, 로그인은 시작한 프론트로 돌아간다
  # 같은 와이파이 폰으로 로컬 프론트를 볼 때만 http://192.168.0.24:5173 처럼 정확한 주소를 환경변수에 더한다 (* 는 IP 숫자 한 칸에만 맞는다)
  allowed-origin-patterns: ${FRONTEND_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,https://gakkum.hubspacekw.com}
  default-origin: ${FRONTEND_DEFAULT_ORIGIN:https://gakkum.hubspacekw.com} # 시작한 프론트를 알 수 없을 때 돌아갈 주소
kakao-pay:
  cid: ${KAKAO_PAY_CID:TC0ONETIME}
  secret-key: ${KAKAO_PAY_SECRET_KEY}
  frontend-base-url: ${KAKAO_PAY_FRONTEND_BASE_URL}
s3: # 자격 증명은 AWS SDK 기본 체인(환경 변수, 프로필, IAM 역할)에서 읽는다
  bucket: ${S3_BUCKET}
  region: ${S3_REGION:ap-northeast-1}
  image-bucket: ${S3_IMAGE_BUCKET} # 프로필·매장 사진용 공개 읽기 버킷. s3.region과 같은 리전이어야 한다
chat-attachment:
  upload-url-ttl: 10m
  view-url-ttl: 15m
  upload-ttl: 1h # 업로드 준비 후 메시지 전송에 사용할 수 있는 기간
  image-max-size: 10MB
  file-max-size: 50MB
media-image:
  upload-url-ttl: 10m
  max-size: 10MB
notification:
  stream:
    enabled: ${NOTIFICATION_STREAM_ENABLED:true} # Redis가 준비된 환경에서 Consumer를 활성화한다
    key: ${NOTIFICATION_STREAM_KEY:notification-events}
    group: ${NOTIFICATION_STREAM_GROUP:notification-persistence}
    batch-size: 100
    poll-interval: 1s
    retry-idle: 30s
    max-length: 10000 # 발행할 때 Stream 을 대략 이 개수로 자른다 (XADD MAXLEN ~). Consumer 가 이만큼 밀리면 오래된 미처리 메시지도 잘린다
job:
  auto-completion: # 최신 제출물이 168시간 동안 검토되지 않은 진행 중 의뢰를 자동 완료한다. 알림 Consumer 활성화 여부와 무관하다
    enabled: ${JOB_AUTO_COMPLETION_ENABLED:true}
    interval: 1h # 기동 직후 한 번 실행하고, 이후 앞 실행이 끝난 시점부터 이 간격으로 실행한다
job-submission-file: # 초안·수정안 파일은 s3.image-bucket의 job-submissions/ 경로에 공개로 저장한다
  upload-url-ttl: 10m
  download-max-concurrency: ${JOB_SUBMISSION_DOWNLOAD_MAX_CONCURRENCY:4} # ZIP 다운로드 동시 처리 수. 넘는 요청은 기다리지 않고 503으로 거절한다
