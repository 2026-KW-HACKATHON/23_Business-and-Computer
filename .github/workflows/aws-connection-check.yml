name: AWS Connection Check

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aws-connection-check.yml

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Inspect OIDC claims
        run: |
          node --input-type=module <<'NODE'
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience', 'sts.amazonaws.com');

          const response = await fetch(url, {
            headers: {
              Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`
            }
          });

          if (!response.ok) {
            throw new Error(`OIDC request failed: ${response.status}`);
          }

          const { value } = await response.json();
          const claims = JSON.parse(
            Buffer.from(value.split('.')[1], 'base64url').toString('utf8')
          );

          console.log(JSON.stringify({
            sub: claims.sub,
            aud: claims.aud,
            repository: claims.repository,
            ref: claims.ref
          }, null, 2));
          NODE

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity
