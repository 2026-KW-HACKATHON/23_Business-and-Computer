name: "⚙️ Chore"
description: "프로젝트 설정 및 개발 환경 작업을 위한 이슈입니다."
title: "[CHORE] "
labels: ["chore"]

body:
  - type: textarea
    id: description
    attributes:
      label: 📌 작업 내용
      description: 설정하거나 변경할 내용을 간단히 작성해주세요.
      placeholder: |
        GitHub Actions를 이용한 CI 환경을 구성합니다.
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 🔗 참고 사항
      description: 참고할 문서나 추가 내용이 있다면 작성해주세요.
    validations:
      required: false
