name: "🐛 Bug"
description: "버그 수정을 위한 이슈입니다."
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 🐛 버그 내용
      description: 발생한 문제를 설명해주세요.
      placeholder: |
        회원가입 시 이미 존재하는 이메일로 가입해도 정상 처리됩니다.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 🔄 재현 방법
      description: 버그가 발생하는 과정을 작성해주세요.
      placeholder: |
        1. 회원가입 API 요청
        2. 기존 회원과 동일한 이메일 입력
        3. 요청 성공
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 🎯 기대 동작
      description: 정상적으로 동작한다면 어떻게 되어야 하는지 작성해주세요.
      placeholder: |
        중복 이메일인 경우 409 Conflict를 반환해야 합니다.
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 🔗 참고 사항
      description: 로그, 스크린샷 등 참고할 내용이 있다면 첨부해주세요.
    validations:
      required: false
